name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Releases are not superseded by a later tag, so no cancel-in-progress here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The builder version is read from the manifest so the two cannot drift.
      - name: install the collector builder
        run: |
          version=$(awk '/otelcol_version:/ {print $2}' examples/builder-manifest.yaml)
          echo "building against collector $version"
          go install "go.opentelemetry.io/collector/cmd/builder@v${version}"

      # Record the tag as the receiver's version, then build against this
      # checkout: the repository is private, so a proxy fetch would need
      # GOPRIVATE plus credentials, and the tag is not fetchable at this point
      # anyway. Drop the replaces rewrite once the module is public.
      - name: point the manifest at this checkout
        run: |
          sed -i "s#networkdevicereceiver v.*#networkdevicereceiver ${GITHUB_REF_NAME}#" examples/builder-manifest.yaml
          sed -i "s#=> .*/networkdevicereceiver\$#=> ${GITHUB_WORKSPACE}#" examples/builder-manifest.yaml
          grep -E 'networkdevicereceiver' examples/builder-manifest.yaml

      # Generates the distribution sources under _build/ and compiles for the
      # runner. The cross-compilation below reuses those generated sources.
      - name: build
        run: builder --config examples/builder-manifest.yaml

      - name: cross-compile
        working-directory: _build
        env:
          # A static binary, so the image can be distroless.
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            out="${GITHUB_WORKSPACE}/dist/${goos}_${goarch}"
            mkdir -p "$out"
            echo "building $target"
            GOOS=$goos GOARCH=$goarch go build -trimpath -o "$out/otelcol-tsuga" .
          done

      # Proves every shipped factory is registered in the built binary, which a
      # compile alone does not: a component can build and still fail to load.
      - name: verify the shipped components
        run: |
          ./dist/linux_amd64/otelcol-tsuga components > components.yaml
          cat components.yaml
          # These are factory names as the components command prints them, which
          # is not always the config key: the otlp exporter reports as
          # otlp_grpc, and contrib processors report snake_case.
          for component in networkdevice netflow syslog otlp \
                           batch memory_limiter cumulative_to_delta transform resource_detection \
                           debug otlp_grpc otlp_http \
                           file_storage health_check opamp; do
            grep -q "^ *- name: ${component}$" components.yaml \
              || { echo "::error::${component} missing from the build"; exit 1; }
          done

      - name: archive
        run: |
          mkdir -p artifacts
          for dir in dist/*/; do
            platform=$(basename "$dir")
            tar -czf "artifacts/otelcol-tsuga_${GITHUB_REF_NAME}_${platform}.tar.gz" \
              -C "$dir" otelcol-tsuga \
              -C "$GITHUB_WORKSPACE" README.md LICENSE NOTICE
          done
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: |
            dist/
            artifacts/
          if-no-files-found: error

  release:
    name: publish the github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen is a pre-release: v1.2.3-rc1, v1.2.3-beta.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $prerelease

  image:
    name: publish the container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Before the download: checkout removes untracked files from the
      # workspace, which would take the binaries with it.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: distribution

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/otelcol-tsuga
          # latest tracks stable tags only, never a pre-release.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
