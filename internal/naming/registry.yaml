# Symbol -> OpenTelemetry metric mapping.
#
# Only standard MIBs are mapped, and only symbols the shipped profiles actually
# collect; corpus_test.go enforces both. Everything else resolves to a generated
# snmp.* name, which is the honest place for a value whose meaning or magnitude
# cannot be established.
#
# The metric_docs section at the end of this file documents each emitted metric.
# It is read only by ./gendoc, which regenerates the per-metric reference in
# documentation.md; run `go generate ./...` after changing a mapping.

metrics:
  ifHCInOctets:
    metric: hw.network.io
    instrument: sum
    unit: By
    attributes:
      hw.type: network
      network.io.direction: receive
  ifHCOutOctets:
    metric: hw.network.io
    instrument: sum
    unit: By
    attributes:
      hw.type: network
      network.io.direction: transmit

  # The unicast/multicast/broadcast discriminator is ours; no convention models it.
  ifHCInUcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: receive
      network.io.cast: unicast
  ifHCOutUcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      network.io.cast: unicast
  ifHCInMulticastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: receive
      network.io.cast: multicast
  ifHCOutMulticastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      network.io.cast: multicast
  ifHCInBroadcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: receive
      network.io.cast: broadcast
  ifHCOutBroadcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      network.io.cast: broadcast

  ifInErrors:
    metric: hw.errors
    instrument: sum
    unit: "{error}"
    attributes:
      hw.type: network
      network.io.direction: receive
      error.type: error
  ifOutErrors:
    metric: hw.errors
    instrument: sum
    unit: "{error}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      error.type: error
  # A discard is a deliberate drop, not an error. hw.* has no dropped-packet
  # metric; component_identity keeps these joinable to hw.network.* per interface.
  ifInDiscards:
    metric: system.network.packet.dropped
    instrument: sum
    unit: "{packet}"
    attributes:
      network.io.direction: receive
    component_identity: true
  ifOutDiscards:
    metric: system.network.packet.dropped
    instrument: sum
    unit: "{packet}"
    attributes:
      network.io.direction: transmit
    component_identity: true

  ifOperStatus:
    metric: hw.network.up
    instrument: updowncounter
    unit: "1"
    attributes:
      hw.type: network
    value_map:
      "1": 1        # up
      default: 0

  ifAdminStatus:
    metric: hw.status
    instrument: updowncounter
    unit: "1"
    attributes:
      hw.type: network
    state_set:
      attribute: hw.state
      states: [ok, degraded, failed]
      map:
        "1": ok       # up
        "2": failed   # down
        "3": degraded # testing

  # _generic-if collects both, and they map to the same metric and attributes, so
  # priority decides: ifSpeed saturates at 4.29 Gbit/s. The only such collision in
  # the corpus.
  ifHighSpeed:
    metric: hw.network.bandwidth.limit
    instrument: updowncounter
    unit: By/s
    attributes:
      hw.type: network
    scale: 125000    # Mbit/s -> By/s
    priority: 10
  ifSpeed:
    metric: hw.network.bandwidth.limit
    instrument: updowncounter
    unit: By/s
    attributes:
      hw.type: network
    scale: 0.125     # bit/s -> By/s
    priority: 1

  # One column whose meaning and magnitude both come from sibling columns.
  #
  # Cisco's CISCO-ENTITY-SENSOR-MIB equivalent is deliberately not mapped: no
  # profile collects its scale and precision columns, so its magnitude cannot be
  # derived.
  entPhySensorValue:
    type_dispatch:
      type_symbol: entPhySensorType
      scale_symbol: entPhySensorScale
      precision_symbol: entPhySensorPrecision
      cases:
        "3": sensor.voltage      # voltsAC
        "4": sensor.voltage      # voltsDC
        "6": sensor.power        # watts
        "8": sensor.temperature  # celsius
        "10": sensor.fan_speed   # rpm

  # Dispatch targets, not symbols.
  sensor.temperature:
    metric: hw.temperature
    instrument: gauge
    unit: Cel
    attributes:
      hw.type: temperature
  sensor.voltage:
    metric: hw.voltage
    instrument: gauge
    unit: V
    attributes:
      hw.type: voltage
  sensor.power:
    metric: hw.power
    instrument: gauge
    unit: W
  sensor.fan_speed:
    metric: hw.fan.speed
    instrument: gauge
    unit: rpm
    attributes:
      hw.type: fan

  upsEstimatedMinutesRemaining:
    metric: hw.battery.time_left
    instrument: gauge
    unit: s
    attributes:
      hw.type: battery
    scale: 60        # minutes -> seconds
  upsEstimatedChargeRemaining:
    metric: hw.battery.charge
    instrument: gauge
    unit: "1"
    attributes:
      hw.type: battery
    scale: 0.01      # percent -> fraction
  upsAdvBatteryCapacity:
    metric: hw.battery.charge
    instrument: gauge
    unit: "1"
    attributes:
      hw.type: battery
    scale: 0.01
  upsBatteryVoltage:
    metric: hw.voltage
    instrument: gauge
    unit: V
    attributes:
      hw.type: voltage
  upsHighPrecInputLineVoltage:
    metric: hw.voltage
    instrument: gauge
    unit: V
    attributes:
      hw.type: voltage
    scale: 0.1       # tenths of a volt
  upsBatteryTemperature:
    metric: hw.temperature
    instrument: gauge
    unit: Cel
    attributes:
      hw.type: temperature

  tcpCurrEstab:
    metric: system.network.connection.count
    instrument: updowncounter
    unit: "{connection}"
    attributes:
      network.transport: tcp
      network.connection.state: established
  hrSystemUptime:
    metric: system.uptime
    instrument: gauge
    unit: s
    scale: 0.01      # TimeTicks -> seconds

# Device-OS metrics, gated by naming.system_namespace_for_device_os. hw.* defines
# nothing for cpu or memory utilization; these system.* metrics are exactly the
# right shapes. Datadog normalises every vendor's OIDs onto these symbol names, so
# a handful of entries covers the whole library.
system_metrics:
  cpu.usage:
    metric: system.cpu.utilization
    instrument: gauge
    unit: "1"
    scale: 0.01      # percent -> fraction
  memory.usage:
    metric: system.memory.utilization
    instrument: gauge
    unit: "1"
    scale: 0.01
  memory.used:
    metric: system.memory.usage
    instrument: updowncounter
    unit: By
    attributes:
      system.memory.state: used
  memory.free:
    metric: system.memory.usage
    instrument: updowncounter
    unit: By
    attributes:
      system.memory.state: free
  memory.total:
    metric: system.memory.limit
    instrument: updowncounter
    unit: By

# Documentation for the metrics the mappings above emit, keyed by metric name
# rather than by symbol because several symbols feed one metric. Read only by
# ./gendoc; the receiver ignores this section. Every emitted metric needs a
# description, and a key naming no metric is an error, so neither can rot
# unnoticed.
metric_docs:
  hw.network.io:
    description: Bytes transferred on a physical interface.
  hw.network.packets:
    description: Packets transferred on a physical interface, split by packet class.
    notes: |
      `network.io.cast` is not a semantic convention; no convention models the
      unicast/multicast/broadcast split.
  hw.errors:
    description: Interface errors.
    notes: |
      A discard is a deliberate drop rather than an error, and is reported
      separately as `system.network.packet.dropped`.
  hw.network.up:
    description: Interface operational state as a boolean.
  hw.status:
    description: |-
      Interface administrative state, as an OpenMetrics StateSet: one datapoint
      per possible state, 1 for the active one and 0 for the rest.
    notes: |
      A value outside the mapping yields all-zero datapoints rather than none, so
      a device in an unexpected state reads as "no known state active" instead of
      dropping out of the series.
  hw.network.bandwidth.limit:
    description: Interface capacity.
    notes: |
      `ifHighSpeed` reports Mbit/s and `ifSpeed` bit/s. Where a profile collects
      both they map to the same metric and the same attributes, so priority
      decides: `ifSpeed` saturates at 4.29 Gbit/s.

      The declared instrument overrides the profile here. Profiles call these
      gauges, but the conventions fix this metric as an UpDownCounter.
  hw.temperature:
    description: Temperature, from an entity sensor or a UPS battery.
  hw.voltage:
    description: Voltage, from an entity sensor, a UPS battery or a UPS input line.
    notes: |
      `upsHighPrecInputLineVoltage` reports tenths of a volt.
  hw.power:
    description: Power drawn, from an entity sensor.
  hw.fan.speed:
    description: Fan speed, from an entity sensor.
  hw.battery.charge:
    description: UPS battery charge remaining, as a fraction of capacity.
    notes: |
      Both symbols report a percentage, scaled here to the fraction the
      convention's unit requires.
  hw.battery.time_left:
    description: Estimated UPS runtime remaining on battery.
    notes: |
      `upsEstimatedMinutesRemaining` reports minutes.
  system.network.packet.dropped:
    description: Interface discards.
    notes: |
      `hw.*` models no dropped-packet metric, so these live under `system.*` but
      opt into the component-identity attributes (`hw.id`, `hw.name` and
      `network.interface.name`), which keeps them joinable to the `hw.network.*`
      metrics for the same interface.
  system.network.connection.count:
    description: Established TCP connections.
  system.uptime:
    description: Time since the device's host resources were last initialised.
    notes: |
      `hrSystemUptime` reports TimeTicks, hundredths of a second.
  system.cpu.utilization:
    description: Device CPU utilisation, as a fraction.
    notes: |
      The symbol reports a percentage, scaled here to a fraction.
  system.memory.utilization:
    description: Device memory utilisation, as a fraction.
    notes: |
      The symbol reports a percentage, scaled here to a fraction.
  system.memory.usage:
    description: Device memory, by state.
  system.memory.limit:
    description: Total device memory.
