# Symbol -> OpenTelemetry metric mapping.
#
# Only standard MIBs are mapped, and only symbols the shipped profiles actually
# collect; corpus_test.go enforces both. Everything else resolves to a generated
# snmp.* name, which is the honest place for a value whose meaning or magnitude
# cannot be established.

metrics:
  ifHCInOctets:
    metric: hw.network.io
    instrument: sum
    unit: By
    attributes:
      hw.type: network
      network.io.direction: receive
  ifHCOutOctets:
    metric: hw.network.io
    instrument: sum
    unit: By
    attributes:
      hw.type: network
      network.io.direction: transmit

  # The unicast/multicast/broadcast discriminator is ours; no convention models it.
  ifHCInUcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: receive
      network.packet.class: unicast
  ifHCOutUcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      network.packet.class: unicast
  ifHCInMulticastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: receive
      network.packet.class: multicast
  ifHCOutMulticastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      network.packet.class: multicast
  ifHCInBroadcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: receive
      network.packet.class: broadcast
  ifHCOutBroadcastPkts:
    metric: hw.network.packets
    instrument: sum
    unit: "{packet}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      network.packet.class: broadcast

  ifInErrors:
    metric: hw.errors
    instrument: sum
    unit: "{error}"
    attributes:
      hw.type: network
      network.io.direction: receive
      error.type: error
  ifOutErrors:
    metric: hw.errors
    instrument: sum
    unit: "{error}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      error.type: error
  ifInDiscards:
    metric: hw.errors
    instrument: sum
    unit: "{error}"
    attributes:
      hw.type: network
      network.io.direction: receive
      error.type: discard
  ifOutDiscards:
    metric: hw.errors
    instrument: sum
    unit: "{error}"
    attributes:
      hw.type: network
      network.io.direction: transmit
      error.type: discard

  ifOperStatus:
    metric: hw.network.up
    instrument: updowncounter
    unit: "1"
    attributes:
      hw.type: network
    value_map:
      "1": 1        # up
      default: 0

  ifAdminStatus:
    metric: hw.status
    instrument: updowncounter
    unit: "1"
    attributes:
      hw.type: network
    state_set:
      attribute: hw.state
      states: [ok, degraded, failed]
      map:
        "1": ok       # up
        "2": failed   # down
        "3": degraded # testing

  # _generic-if collects both, and they map to the same metric and attributes, so
  # priority decides: ifSpeed saturates at 4.29 Gbit/s. The only such collision in
  # the corpus.
  ifHighSpeed:
    metric: hw.network.bandwidth.limit
    instrument: updowncounter
    unit: By/s
    attributes:
      hw.type: network
    scale: 125000    # Mbit/s -> By/s
    priority: 10
  ifSpeed:
    metric: hw.network.bandwidth.limit
    instrument: updowncounter
    unit: By/s
    attributes:
      hw.type: network
    scale: 0.125     # bit/s -> By/s
    priority: 1

  # One column whose meaning and magnitude both come from sibling columns.
  #
  # Cisco's CISCO-ENTITY-SENSOR-MIB equivalent is deliberately not mapped: no
  # profile collects its scale and precision columns, so its magnitude cannot be
  # derived.
  entPhySensorValue:
    type_dispatch:
      type_symbol: entPhySensorType
      scale_symbol: entPhySensorScale
      precision_symbol: entPhySensorPrecision
      cases:
        "3": sensor.voltage      # voltsAC
        "4": sensor.voltage      # voltsDC
        "6": sensor.power        # watts
        "8": sensor.temperature  # celsius
        "10": sensor.fan_speed   # rpm

  # Dispatch targets, not symbols.
  sensor.temperature:
    metric: hw.temperature
    instrument: gauge
    unit: Cel
    attributes:
      hw.type: temperature
  sensor.voltage:
    metric: hw.voltage
    instrument: gauge
    unit: V
    attributes:
      hw.type: voltage
  sensor.power:
    metric: hw.power
    instrument: gauge
    unit: W
  sensor.fan_speed:
    metric: hw.fan.speed
    instrument: gauge
    unit: rpm
    attributes:
      hw.type: fan

  upsEstimatedMinutesRemaining:
    metric: hw.battery.time_left
    instrument: gauge
    unit: s
    attributes:
      hw.type: battery
    scale: 60        # minutes -> seconds
  upsEstimatedChargeRemaining:
    metric: hw.battery.charge
    instrument: gauge
    unit: "1"
    attributes:
      hw.type: battery
    scale: 0.01      # percent -> fraction
  upsAdvBatteryCapacity:
    metric: hw.battery.charge
    instrument: gauge
    unit: "1"
    attributes:
      hw.type: battery
    scale: 0.01
  upsBatteryVoltage:
    metric: hw.voltage
    instrument: gauge
    unit: V
    attributes:
      hw.type: voltage
  upsHighPrecInputLineVoltage:
    metric: hw.voltage
    instrument: gauge
    unit: V
    attributes:
      hw.type: voltage
    scale: 0.1       # tenths of a volt
  upsBatteryTemperature:
    metric: hw.temperature
    instrument: gauge
    unit: Cel
    attributes:
      hw.type: temperature

  tcpCurrEstab:
    metric: system.network.connection.count
    instrument: updowncounter
    unit: "{connection}"
    attributes:
      network.transport: tcp
      network.connection.state: established
    tier: 2
  hrSystemUptime:
    metric: system.uptime
    instrument: gauge
    unit: s
    scale: 0.01      # TimeTicks -> seconds
    tier: 2

# Device-OS metrics, gated by naming.system_namespace_for_device_os. hw.* defines
# nothing for cpu or memory utilization; these system.* metrics are exactly the
# right shapes. Datadog normalises every vendor's OIDs onto these symbol names, so
# a handful of entries covers the whole library.
system_metrics:
  cpu.usage:
    metric: system.cpu.utilization
    instrument: gauge
    unit: "1"
    scale: 0.01      # percent -> fraction
  memory.usage:
    metric: system.memory.utilization
    instrument: gauge
    unit: "1"
    scale: 0.01
  memory.used:
    metric: system.memory.usage
    instrument: updowncounter
    unit: By
    attributes:
      system.memory.state: used
  memory.free:
    metric: system.memory.usage
    instrument: updowncounter
    unit: By
    attributes:
      system.memory.state: free
  memory.total:
    metric: system.memory.limit
    instrument: updowncounter
    unit: By
